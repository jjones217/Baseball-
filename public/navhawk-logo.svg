<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- ── Compass ring (double) ── -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#c9a96e" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.35"/>

  <!-- North spike: double for emphasis -->
  <path d="M100 5 L105 19 L100 15 L95 19Z"  fill="#c9a96e"/>
  <path d="M100 5 L108 17 L100 23 L92 17Z"  fill="#c9a96e" opacity="0.45"/>
  <!-- S / E / W minor spikes -->
  <path d="M100 195 L104 182 L100 185 L96 182Z" fill="#c9a96e"/>
  <path d="M195 100 L182 96  L185 100 L182 104Z" fill="#c9a96e"/>
  <path d="M5   100 L18  96  L15  100 L18  104Z" fill="#c9a96e"/>

  <!-- Globe grid (subtle) -->
  <line x1="100" y1="8"   x2="100" y2="192" stroke="#c9a96e" stroke-width="0.7" opacity="0.18"/>
  <line x1="8"   y1="100" x2="192" y2="100" stroke="#c9a96e" stroke-width="0.7" opacity="0.18"/>
  <ellipse cx="100" cy="100" rx="95" ry="27" fill="none" stroke="#c9a96e" stroke-width="0.6" opacity="0.15"/>
  <ellipse cx="100" cy="75"  rx="70" ry="16" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.11"/>

  <!-- ══════════════════════════════════
       HAWK  (faces right)
       ══════════════════════════════════ -->

  <!-- Left wing — single clean sweep -->
  <path d="M108 100
           C 90 86,  56 72,  22 68
           C 16 70,  16 80,  24 83
           C 42 80,  70 88, 104 102Z"
        fill="#c9a96e"/>

  <!-- Body ellipse -->
  <ellipse cx="126" cy="96" rx="28" ry="13" transform="rotate(-15 126 96)" fill="#c9a96e"/>

  <!-- Head -->
  <circle cx="150" cy="79" r="17" fill="#c9a96e"/>

  <!-- Hooked beak -->
  <path d="M163 72
           C 182 69, 193 79, 187 88
           C 182 94, 165 94, 163 89
           C 165 84, 163 78Z"
        fill="#8a6d3b"/>

  <!-- Eye -->
  <circle cx="155" cy="77" r="5"   fill="#0c0a09"/>
  <circle cx="153" cy="75" r="1.8" fill="#c9a96e" opacity="0.55"/>

  <!-- ── Water line ── -->
  <path d="M18 124 Q40 116 62 124 Q84 132 106 124 Q128 116 150 124 Q166 131 182 124"
        fill="none" stroke="#c9a96e" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>

  <!-- ══════════════════════════════════
       SUBMARINE
       ══════════════════════════════════ -->

  <!-- Hull -->
  <path d="M36 153
           C 40 140, 76 136, 112 136
           C 150 136, 174 144, 180 154
           C 174 164, 150 168, 112 168
           C  76 168,  40 164,  36 153Z"
        fill="#c9a96e"/>

  <!-- Conning tower -->
  <path d="M114 136 L120 119 L138 119 L144 136Z" fill="#c9a96e"/>

  <!-- Periscope + viewport ring -->
  <line x1="126" y1="119" x2="126" y2="109" stroke="#c9a96e" stroke-width="3"   stroke-linecap="round"/>
  <circle cx="126" cy="108" r="4" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <line x1="136" y1="119" x2="136" y2="113" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="round"/>

</svg>
