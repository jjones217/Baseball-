<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- ── Compass ring ── -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#c9a96e" stroke-width="2"/>

  <!-- Cardinal spikes: N prominent, others small -->
  <polygon points="50,3  53.5,15  50,12  46.5,15"  fill="#c9a96e"/>
  <polygon points="50,3  56,14    50,19  44,14"     fill="#c9a96e" opacity="0.4"/>
  <polygon points="50,97 53,86 50,89 47,86"         fill="#c9a96e"/>
  <polygon points="97,50 86,47 89,50 86,53"         fill="#c9a96e"/>
  <polygon points="3,50  14,47 11,50 14,53"         fill="#c9a96e"/>

  <!-- Crosshair + equator grid (subtle) -->
  <line x1="50" y1="5"  x2="50" y2="95" stroke="#c9a96e" stroke-width="0.5" opacity="0.18"/>
  <line x1="5"  y1="50" x2="95" y2="50" stroke="#c9a96e" stroke-width="0.5" opacity="0.18"/>
  <ellipse cx="50" cy="50" rx="46" ry="13" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.15"/>

  <!-- ── Hawk silhouette ── -->

  <!-- Left wing — one clean filled sweep -->
  <path d="M48 56
           C 40 50, 25 42, 8  47
           C 5  52, 9  58, 18 57
           C 12 62, 13 68, 22 65
           C 32 58, 42 57, 47 58 Z"
        fill="#c9a96e"/>

  <!-- Right wing — smaller, hawk faces right -->
  <path d="M52 55
           C 60 49, 72 44, 83 47
           C 88 50, 87 56, 80 56
           C 84 61, 82 66, 74 63
           C 65 58, 57 57, 52 58 Z"
        fill="#c9a96e"/>

  <!-- Body + tail -->
  <path d="M47 58 Q50 62 50 72 Q50 62 53 58 Q51 56 50 56 Q49 56 47 58Z" fill="#c9a96e"/>

  <!-- Neck (bridges body to head) -->
  <path d="M52 55 Q56 50 61 47 Q58 53 55 57 Z" fill="#c9a96e"/>

  <!-- Head -->
  <circle cx="64" cy="44" r="7" fill="#c9a96e"/>

  <!-- Hooked beak -->
  <path d="M70 41 L80 45 L71 51 L70 47 Z" fill="#8a6d3b"/>

  <!-- Eye -->
  <circle cx="65" cy="43" r="2.2" fill="#0d0b09"/>
  <circle cx="64.3" cy="42.3" r="0.8" fill="#c9a96e" opacity="0.6"/>

  <!-- ── Submarine ── -->

  <!-- Hull -->
  <path d="M20 77
           Q24 68 50 67
           Q73 66 80 72
           Q85 77 80 82
           Q60 88 38 87
           Q18 85 20 77 Z"
        fill="#c9a96e"/>

  <!-- Conning tower -->
  <path d="M54 67 L57 59 L66 59 L69 67 Z" fill="#c9a96e"/>

  <!-- Periscope -->
  <line x1="60" y1="59" x2="60" y2="53" stroke="#c9a96e" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="60" cy="52" r="1.8" fill="none" stroke="#c9a96e" stroke-width="1.2"/>

  <!-- Water waves -->
  <path d="M16 76 Q24 71 32 76 Q40 81 48 76 Q56 71 64 76 Q70 80 78 76"
        fill="none" stroke="#c9a96e" stroke-width="1.3"
        stroke-linecap="round" opacity="0.45"/>

</svg>
